nazev: "Křemže 3, N/Z 1736–1777, O 1752–1778 (inv. č. 2849) – římskokatolická matrika fary Křemže (421 snímků), latina; obce Bohouškovice, Chlum, Chlumeček, Holubov, Krasetín, Křemže, Lhotka, Loučej, Mříč, Stupná, Třísov. Křty chronologicky, číslováno po stranách (pag. 347 = sn. 177 vpravo, březen 1769); sn. 350 = zemřelí 1771. Rejstřík 4991 „C + číslo“ = strana této knihy."
druh: "matrika"
roky: "1736–1778"
obsah: "snímek = číslo snímku na portálu"

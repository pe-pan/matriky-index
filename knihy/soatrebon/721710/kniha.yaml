nazev: "Pozemková (gruntovní) kniha rychty Chmelná, 2. díl – Krasetín a Stupná, (1591) 1749–1883, Prelatura Český Krumlov (Prelátský farní úřad), poř. č. 11, sign. SÚA 227 (Grundbuch Lit. B Nr. II) – gruntovní kniha – převody gruntů a splátky; sn 1–3 obálka a vložený rejstřík Krasetína (č. domu, majitel, staré folio, nová folia „von … bis …“); nová folia: sn 21 = fol 20 (č. 19 Novák), sn 30 = fol 43 a sn 31 = fol 44 (č. 23 Froida), sn 45 = fol 66 (č. 12); č. 11 Jakub Froida fol 82–91, č. 7 Jakub Novák fol 74–81"
druh: "pozemková kniha"
roky: "1591–1883"
obsah: "snímek = číslo snímku na portálu"
url: "https://digi.ceskearchivy.cz/721710"
poznamka: "zápisy přečtené při práci na rodokmenu; jen vybrané zápisy, ne celá kniha"
